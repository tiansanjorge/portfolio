<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-labelledby="t d">
  <title id="t">FAQ RAG pipeline</title>
  <desc id="d">A document is chunked, embedded and indexed; a question is embedded, matched by cosine similarity, and answered by GPT-4o-mini with the retrieved chunks cited.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0a6d2"/>
    </marker>
    <style>
      text { font-family: Satoshi, 'Segoe UI', Roboto, Arial, sans-serif; text-anchor: middle; }
      .t { fill: #e7e7e7; font-size: 14px; font-weight: 700; }
      .s { fill: #f0a6d2; font-size: 11px; }
      .b { fill: #f0a6d2; font-size: 12px; }
      .l { fill: #a5a5a5; font-size: 11px; letter-spacing: 1px; }
    </style>
  </defs>
  <text x="10" y="18" class="l" style="text-anchor:start">INDEXING · ONCE</text>
  <rect x="10" y="28" width="100" height="60" rx="10" fill="#2a0f20" stroke="#b83280" stroke-width="1.6"/>
  <text x="60.0" y="63.0" class="t">FAQ doc</text>
  <rect x="130" y="28" width="140" height="60" rx="10" fill="#2a0f20" stroke="#b83280" stroke-width="1.6"/>
  <text x="200.0" y="54.0" class="t">Chunking</text>
  <text x="200.0" y="73.0" class="s">150 tok · 30 overlap</text>
  <rect x="290" y="28" width="130" height="60" rx="10" fill="#2a0f20" stroke="#b83280" stroke-width="1.6"/>
  <text x="355.0" y="54.0" class="t">Embeddings</text>
  <text x="355.0" y="73.0" class="s">3-small · 1536 dims</text>
  <rect x="440" y="28" width="110" height="60" rx="10" fill="#2a0f20" stroke="#ff7ac6" stroke-width="1.6"/>
  <text x="495.0" y="54.0" class="t">Vector index</text>
  <text x="495.0" y="73.0" class="s">JSON file</text>
  <path d="M110 58 H128" fill="none" stroke="#f0a6d2" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M270 58 H288" fill="none" stroke="#f0a6d2" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M420 58 H438" fill="none" stroke="#f0a6d2" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="10" y="156" class="l" style="text-anchor:start">QUERY · PER QUESTION</text>
  <rect x="10" y="168" width="100" height="60" rx="10" fill="#2a0f20" stroke="#b83280" stroke-width="1.6"/>
  <text x="60.0" y="203.0" class="t">Question</text>
  <rect x="130" y="168" width="140" height="60" rx="10" fill="#2a0f20" stroke="#ff7ac6" stroke-width="1.6"/>
  <text x="200.0" y="194.0" class="t">Cosine k-NN</text>
  <text x="200.0" y="213.0" class="s">NumPy · top-k</text>
  <rect x="290" y="168" width="130" height="60" rx="10" fill="#2a0f20" stroke="#b83280" stroke-width="1.6"/>
  <text x="355.0" y="194.0" class="t">Generation</text>
  <text x="355.0" y="213.0" class="s">GPT-4o-mini</text>
  <rect x="440" y="168" width="110" height="60" rx="10" fill="#2a0f20" stroke="#ff7ac6" stroke-width="1.6"/>
  <text x="495.0" y="194.0" class="t">JSON answer</text>
  <text x="495.0" y="213.0" class="s">+ chunks_related</text>
  <path d="M110 198 H128" fill="none" stroke="#f0a6d2" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M270 198 H288" fill="none" stroke="#f0a6d2" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M420 198 H438" fill="none" stroke="#f0a6d2" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M495 88 V128 H200 V166" fill="none" stroke="#f0a6d2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M495 228 V262" fill="none" stroke="#f0a6d2" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="290" y="264" width="260" height="52" rx="10" fill="rgba(240,166,210,0.06)" stroke="#f0a6d2" stroke-opacity="0.55" stroke-dasharray="5 4"/>
  <text x="420.0" y="294.0" class="b">Evaluator agent · LLM judge (bonus)</text>
</svg>
