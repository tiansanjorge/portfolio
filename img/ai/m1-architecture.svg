<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" role="img" aria-labelledby="t d">
  <title id="t">Helpdesk CLI pipeline</title>
  <desc id="d">A question passes an input guard, is answered by GPT-4o-mini with chain-of-thought, parsed and repaired, validated against a schema and returned as JSON, with metrics logged to CSV.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f4a6b8"/>
    </marker>
    <style>
      text { font-family: Satoshi, 'Segoe UI', Roboto, Arial, sans-serif; text-anchor: middle; }
      .t { fill: #e7e7e7; font-size: 14px; font-weight: 700; }
      .s { fill: #f4a6b8; font-size: 11px; }
      .b { fill: #f4a6b8; font-size: 12px; }
      .l { fill: #c9c9c9; font-size: 11px; letter-spacing: 1px; }
    </style>
  </defs>
  <rect x="10" y="24" width="140" height="60" rx="10" fill="#2a0d14" stroke="#b02a4f" stroke-width="1.6"/>
  <text x="80.0" y="59.0" class="t">Question</text>
  <rect x="210" y="24" width="140" height="60" rx="10" fill="#2a0d14" stroke="#b02a4f" stroke-width="1.6"/>
  <text x="280.0" y="50.0" class="t">Input guard</text>
  <text x="280.0" y="69.0" class="s">regex guardrails</text>
  <rect x="410" y="24" width="140" height="60" rx="10" fill="#2a0d14" stroke="#ff7a96" stroke-width="1.6"/>
  <text x="480.0" y="50.0" class="t">LLM</text>
  <text x="480.0" y="69.0" class="s">GPT-4o-mini · CoT</text>
  <rect x="410" y="150" width="140" height="60" rx="10" fill="#2a0d14" stroke="#b02a4f" stroke-width="1.6"/>
  <text x="480.0" y="176.0" class="t">Parse + repair</text>
  <text x="480.0" y="195.0" class="s">one repair attempt</text>
  <rect x="210" y="150" width="140" height="60" rx="10" fill="#2a0d14" stroke="#b02a4f" stroke-width="1.6"/>
  <text x="280.0" y="176.0" class="t">Schema check</text>
  <text x="280.0" y="195.0" class="s">fallback if invalid</text>
  <rect x="10" y="150" width="140" height="60" rx="10" fill="#2a0d14" stroke="#ff7a96" stroke-width="1.6"/>
  <text x="80.0" y="176.0" class="t">Validated JSON</text>
  <text x="80.0" y="195.0" class="s">answer · confidence</text>
  <path d="M150 54 H208" fill="none" stroke="#f4a6b8" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M350 54 H408" fill="none" stroke="#f4a6b8" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M480 84 V148" fill="none" stroke="#f4a6b8" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M410 180 H352" fill="none" stroke="#f4a6b8" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M210 180 H152" fill="none" stroke="#f4a6b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="10" y="250" width="540" height="44" rx="10" fill="rgba(244,166,184,0.06)" stroke="#f4a6b8" stroke-opacity="0.55" stroke-dasharray="5 4"/>
  <text x="280.0" y="276.0" class="b">metrics.csv · tokens · latency · estimated cost per run</text>
</svg>
