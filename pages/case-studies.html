      /* Scroll reveal animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInRight {
        from {
          opacity: 0;
          transform: translateX(30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .scroll-reveal {
        opacity: 0;
      }

      .scroll-reveal.animate-fade-up {
        transform: translateY(30px);
      }

      .scroll-reveal.animate-fade-right {
        transform: translateX(30px);
      }

      .scroll-reveal.visible {
        animation-play-state: running;
      }

      .animate-fade-up.visible {
        animation: fadeInUp 0.8s ease-out both;
      }

      .animate-fade-right.visible {
        animation: fadeInRight 0.8s ease-out both;
      }

      .delay-1 {
        animation-delay: 0.1s;
      }
      .delay-2 {
        animation-delay: 0.2s;
      }
      .delay-3 {

      .delay-4 {

    <script>
      (function () {
        var cards = document.querySelectorAll(".case-card");

        function closeCard(card) {
          var body = card.querySelector(".case-card-body");
          var header = card.querySelector(".case-card-header");
          // Fija la altura actual antes de animar a 0, si no la transición no tiene de dónde partir
          body.style.maxHeight = body.scrollHeight + "px";
          requestAnimationFrame(function () {
            body.style.maxHeight = "0px";
          });
          body.classList.remove("open");
          card.classList.remove("open");
          header.setAttribute("aria-expanded", "false");
        }

        function openCard(card) {
          var body = card.querySelector(".case-card-body");
          var header = card.querySelector(".case-card-header");
          body.style.maxHeight = body.scrollHeight + "px";
          body.classList.add("open");
          card.classList.add("open");
          header.setAttribute("aria-expanded", "true");
        }

        cards.forEach(function (card) {
          var header = card.querySelector(".case-card-header");

          header.addEventListener("click", function () {
            var isOpen = card.classList.contains("open");

            cards.forEach(function (c) {
              if (c.classList.contains("open")) closeCard(c);
            });

            if (!isOpen) openCard(card);
          });

          // Una vez terminada la transición de apertura, se libera el max-height
          // fijo para que el contenido pueda reflowear si cambia el viewport
          var body = card.querySelector(".case-card-body");
          body.addEventListener("transitionend", function (e) {
            if (e.propertyName === "max-height" && body.classList.contains("open")) {
              body.style.maxHeight = "none";
            }
          });
        });
      })();
    </script>
